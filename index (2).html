<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelas 7E — SMPIT Abu Bakar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400..700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a;
    --bg-panel:#131311;
    --bg-panel-2:#181815;
    --emerald:#0d3b34;
    --emerald-light:#1c6b5c;
    --gold:#c9a961;
    --gold-bright:#e6c988;
    --text:#f2ece0;
    --text-dim:#948d7d;
    --line:#2a2822;
    --danger:#b5453a;
    --radius:2px;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    line-height:1.6;
    background-image:
      radial-gradient(circle at 15% 10%, rgba(28,107,92,0.10), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(201,169,97,0.06), transparent 40%);
    min-height:100vh;
  }

  a{color:var(--gold-bright); text-decoration:none;}

  h1,h2,h3{font-family:'Reem Kufi', sans-serif; font-weight:600; letter-spacing:0.02em;}

  .mono{font-family:'IBM Plex Mono', monospace;}

  /* ---------- Star motif ---------- */
  .star{
    width:34px; height:34px; display:inline-block;
    color:var(--gold);
  }

  /* ---------- Hero ---------- */
  .hero{
    text-align:center;
    padding:64px 20px 40px;
    border-bottom:1px solid var(--line);
  }
  .hero .star{margin-bottom:14px;}
  .hero h1{
    font-size:clamp(2.4rem, 7vw, 4.2rem);
    color:var(--gold-bright);
    text-shadow:0 0 40px rgba(201,169,97,0.15);
  }
  .hero .sub{
    margin-top:10px;
    font-family:'Reem Kufi', sans-serif;
    font-size:clamp(1rem,3vw,1.3rem);
    color:var(--text-dim);
    letter-spacing:0.3em;
    text-transform:uppercase;
  }
  .hero .tagline{
    margin-top:18px;
    color:var(--text-dim);
    font-size:0.95rem;
  }
  .divider{
    width:120px; height:1px; background:var(--line); margin:26px auto;
    position:relative;
  }
  .divider::after{
    content:"◆"; color:var(--gold); position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%); background:var(--bg); padding:0 10px; font-size:10px;
  }

  /* ---------- Nav ---------- */
  .nav{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; flex-wrap:wrap;
    padding:14px 24px;
    background:rgba(10,10,10,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .tabs{display:flex; gap:6px; flex-wrap:wrap;}
  .tab-btn{
    background:none; border:1px solid transparent; color:var(--text-dim);
    font-family:'Reem Kufi', sans-serif; font-size:0.85rem; letter-spacing:0.08em;
    text-transform:uppercase; padding:9px 16px; cursor:pointer; border-radius:var(--radius);
    transition:all .2s;
  }
  .tab-btn:hover{color:var(--text); border-color:var(--line);}
  .tab-btn.active{color:var(--gold-bright); border-color:var(--gold); background:rgba(201,169,97,0.06);}

  .admin-zone{display:flex; align-items:center; gap:10px;}
  .admin-pill{
    font-family:'IBM Plex Mono', monospace; font-size:0.72rem; color:var(--emerald-light);
    border:1px solid var(--emerald-light); padding:4px 10px; border-radius:20px;
    display:none; align-items:center; gap:6px;
  }
  .admin-pill.show{display:inline-flex;}

  button{cursor:pointer; font-family:inherit;}
  .btn{
    background:transparent; color:var(--gold-bright); border:1px solid var(--gold);
    padding:8px 16px; font-size:0.82rem; letter-spacing:0.04em; border-radius:var(--radius);
    transition:all .2s;
  }
  .btn:hover{background:var(--gold); color:#0a0a0a;}
  .btn.danger{border-color:var(--danger); color:var(--danger);}
  .btn.danger:hover{background:var(--danger); color:#fff;}
  .btn.small{padding:5px 10px; font-size:0.72rem;}
  .btn.ghost{border-color:var(--line); color:var(--text-dim);}
  .btn.ghost:hover{background:var(--bg-panel-2); color:var(--text);}

  /* ---------- Sections ---------- */
  main{max-width:1160px; margin:0 auto; padding:40px 24px 90px;}
  .section{display:none;}
  .section.active{display:block; animation:fadeIn .35s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .section-head{margin-bottom:28px; display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:12px;}
  .section-head h2{font-size:1.7rem; color:var(--gold-bright);}
  .section-head .count{color:var(--text-dim); font-size:0.85rem; font-family:'IBM Plex Mono', monospace;}

  /* ---------- Student Grid ---------- */
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
    gap:16px;
  }
  .card{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden; cursor:pointer;
    transition:border-color .2s, transform .2s;
    position:relative;
  }
  .card:hover{border-color:var(--gold); transform:translateY(-3px);}
  .card .no-tag{
    position:absolute; top:8px; left:8px; z-index:2;
    background:rgba(10,10,10,0.75); color:var(--gold-bright);
    font-family:'IBM Plex Mono', monospace; font-size:0.7rem;
    padding:2px 7px; border:1px solid var(--gold); border-radius:20px;
  }
  .card img{width:100%; aspect-ratio:1/1; object-fit:cover; display:block; filter:grayscale(35%) contrast(1.05);}
  .card:hover img{filter:grayscale(0%) contrast(1.05);}
  .card .name{padding:10px 12px 12px; font-size:0.88rem; font-weight:600; text-align:center;}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.75);
    display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--bg-panel); border:1px solid var(--gold); max-width:560px; width:100%;
    border-radius:var(--radius); position:relative; max-height:88vh; overflow:auto;
  }
  .modal-close{
    position:absolute; top:12px; right:12px; background:none; border:none;
    color:var(--text-dim); font-size:1.4rem; line-height:1; z-index:2;
  }
  .modal-close:hover{color:var(--gold-bright);}
  .modal-photo{width:100%; aspect-ratio:16/10; object-fit:cover; border-bottom:1px solid var(--line);}
  .modal-body{padding:24px 26px 28px;}
  .modal-body .tagno{
    font-family:'IBM Plex Mono', monospace; color:var(--emerald-light); font-size:0.78rem;
  }
  .modal-body h3{font-size:1.5rem; color:var(--gold-bright); margin:6px 0 14px;}
  .modal-body .bio{color:var(--text); font-size:0.92rem; margin-bottom:18px; white-space:pre-line;}
  .socials{display:flex; gap:10px; flex-wrap:wrap;}
  .social-link{
    border:1px solid var(--line); padding:7px 14px; border-radius:20px; font-size:0.8rem;
    color:var(--text-dim); transition:all .2s;
  }
  .social-link:hover{border-color:var(--gold); color:var(--gold-bright);}

  /* ---------- Prestasi (timeline) ---------- */
  .timeline{border-left:1px solid var(--line); padding-left:26px; display:flex; flex-direction:column; gap:26px;}
  .t-item{position:relative;}
  .t-item::before{
    content:""; position:absolute; left:-31px; top:4px; width:9px; height:9px;
    background:var(--gold); transform:rotate(45deg);
  }
  .t-item .t-date{font-family:'IBM Plex Mono', monospace; font-size:0.75rem; color:var(--emerald-light);}
  .t-item h4{font-size:1.1rem; margin:4px 0 6px; color:var(--gold-bright); font-family:'Reem Kufi', sans-serif;}
  .t-item p{color:var(--text-dim); font-size:0.9rem;}
  .t-item .t-controls{margin-top:8px;}
  .empty-state{color:var(--text-dim); font-size:0.9rem; padding:20px 0;}

  /* ---------- Galeri ---------- */
  .gal-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(190px,1fr)); gap:14px;}
  .gal-item{border:1px solid var(--line); overflow:hidden; position:relative; cursor:pointer;}
  .gal-item img{width:100%; aspect-ratio:4/3; object-fit:cover; display:block; transition:transform .3s;}
  .gal-item:hover img{transform:scale(1.06);}
  .gal-item .gal-del{
    position:absolute; top:6px; right:6px; background:rgba(10,10,10,0.8); border:1px solid var(--danger);
    color:var(--danger); font-size:0.7rem; padding:3px 8px; border-radius:20px;
  }

  /* ---------- Admin forms ---------- */
  .admin-form{
    background:var(--bg-panel-2); border:1px dashed var(--emerald-light); border-radius:var(--radius);
    padding:18px; margin-bottom:26px; display:none;
  }
  .admin-form.show{display:block;}
  .admin-form label{display:block; font-size:0.75rem; color:var(--text-dim); margin-bottom:5px; margin-top:12px;}
  .admin-form label:first-child{margin-top:0;}
  .admin-form input, .admin-form textarea{
    width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text);
    padding:9px 11px; font-family:inherit; font-size:0.88rem; border-radius:var(--radius);
  }
  .admin-form textarea{resize:vertical; min-height:70px;}
  .admin-form .row{display:flex; gap:12px; margin-top:14px; flex-wrap:wrap;}

  .login-box{
    background:var(--bg-panel-2); border:1px solid var(--line); padding:14px; border-radius:var(--radius);
    display:none; gap:8px; position:absolute; right:24px; top:64px; z-index:60; flex-direction:column; width:230px;
  }
  .login-box.show{display:flex;}
  .login-box input{background:var(--bg); border:1px solid var(--line); color:var(--text); padding:8px; border-radius:var(--radius); font-size:0.85rem;}
  .login-box .msg{font-size:0.75rem; color:var(--danger); min-height:14px;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--emerald); color:var(--gold-bright); padding:11px 22px; border-radius:20px;
    font-size:0.85rem; border:1px solid var(--emerald-light); opacity:0; pointer-events:none;
    transition:all .3s; z-index:200;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  footer{text-align:center; padding:30px; color:var(--text-dim); font-size:0.8rem; border-top:1px solid var(--line);}

  @media (max-width:640px){
    .nav{padding:12px 16px;}
    .login-box{right:16px; width:calc(100% - 32px); left:16px;}
  }
</style>
</head>
<body>

<header class="hero">
  <svg class="star" viewBox="0 0 100 100" fill="currentColor"><path d="M50 0 L61 39 L100 39 L68 61 L79 100 L50 76 L21 100 L32 61 L0 39 L39 39 Z" opacity="0.9"/></svg>
  <h1>KELAS 7E</h1>
  <div class="sub">SMPIT Abu Bakar</div>

</header>

<nav class="nav">
  <div class="tabs">
    <button class="tab-btn active" data-tab="absen">Absensi</button>

    <button class="btn small" id="loginToggleBtn">Login Admin</button>

    <div class="login-box" id="loginBox">
      <label style="font-size:0.75rem;color:var(--text-dim);">Password Admin</label>
      <input type="password" id="passInput" placeholder="••••••••">
      <button class="btn small" id="passSubmit">Masuk</button>
      <div class="msg" id="loginMsg"></div>
    </div>
  </div>
</nav>

<main>

  <!-- ABSENSI -->
  <section class="section active" id="tab-absen">
    <div class="section-head">
      <h2>Daftar Absensi</h2>
      <span class="count" id="studentCount"></span>
    </div>
    <div class="grid" id="studentGrid"></div>
  </section>

  <!-- PRESTASI -->
  <section class="section" id="tab-prestasi">
    <div class="section-head">
      <h2>Daftar Prestasi</h2>
      <button class="btn small" id="showPrestasiForm" style="display:none;">+ Tambah Prestasi</button>
    </div>

    <div class="admin-form" id="prestasiForm">
      <label>Judul Prestasi</label>
      <input type="text" id="pTitle" placeholder="Contoh: Juara 1 Lomba Cerdas Cermat">
      <label>Tanggal / Keterangan Waktu</label>
      <input type="text" id="pDate" placeholder="Contoh: Agustus 2026">
      <label>Deskripsi</label>
      <textarea id="pDesc" placeholder="Ceritakan singkat prestasinya..."></textarea>
      <div class="row">
        <button class="btn" id="pSubmit">Simpan Prestasi</button>
        <button class="btn ghost" id="pCancel">Batal</button>
      </div>
    </div>

    <div class="timeline" id="prestasiList">
      <div class="empty-state">Memuat data prestasi...</div>
    </div>
  </section>

  <!-- GALERI -->
  <section class="section" id="tab-galeri">
    <div class="section-head">
      <h2>Galeri Foto Kelas</h2>
      <button class="btn small" id="showGaleriForm" style="display:none;">+ Tambah Foto</button>
    </div>

    <div class="admin-form" id="galeriForm">
      <label>URL Foto</label>
      <input type="text" id="gUrl" placeholder="https://...">
      <label>Keterangan (opsional)</label>
      <input type="text" id="gCaption" placeholder="Contoh: Study tour ke museum">
      <div class="row">
        <button class="btn" id="gSubmit">Simpan Foto</button>
        <button class="btn ghost" id="gCancel">Batal</button>
      </div>
    </div>

    <div class="gal-grid" id="galeriGrid">
      <div class="empty-state">Memuat galeri...</div>
    </div>
  </section>

</main>

<!-- Modal detail siswa -->
<div class="overlay" id="studentOverlay">
  <div class="modal">
    <button class="modal-close" id="modalClose">&times;</button>
    <img class="modal-photo" id="modalPhoto" src="" alt="">
    <div class="modal-body">

      <!-- Tampilan biasa -->
      <div id="modalView">
        <div class="tagno" id="modalNo"></div>
        <h3 id="modalName"></h3>
        <p class="bio" id="modalBio"></p>
        <div class="socials" id="modalSocials"></div>
        <button class="btn small" id="editStudentBtn" style="display:none; margin-top:16px;">✎ Edit Biodata</button>
      </div>

      <!-- Form edit (admin only) -->
      <div class="admin-form" id="modalEditForm" style="margin-top:0;">
        <label>URL Foto</label>
        <input type="text" id="eFoto" placeholder="https://...">
        <label>Tentang Dirinya (bio)</label>
        <textarea id="eBio" placeholder="Tulis biodata singkat..."></textarea>
        <label>Username Instagram (tanpa @)</label>
        <input type="text" id="eIg" placeholder="contoh: nama.siswa">
        <label>Username TikTok (tanpa @)</label>
        <input type="text" id="eTiktok" placeholder="contoh: nama.siswa">
        <label>Nomor WhatsApp (format 62...)</label>
        <input type="text" id="eWa" placeholder="contoh: 6281234567890">
        <div class="row">
          <button class="btn" id="eSave">Simpan</button>
          <button class="btn ghost" id="eCancel">Batal</button>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<footer>Website Kelas 7E &middot; SMPIT Abu Bakar</footer>

/* Password admin - ganti sesuai keinginan */
const ADMIN_PASSWORD = "abubakar7e";
let isAdmin = false;

/* ---------------- Utils ---------------- */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2200);
}

/* ---------------- Tabs ---------------- */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

/* ---------------- Biodata siswa (bisa diedit admin dari web, tersimpan otomatis) ---------------- */
const STUDENT_OVERRIDES_KEY = 'kelas7e-siswa-overrides';
let studentOverrides = {}; // { "1": {foto, bio, ig, tiktok, wa}, ... }

async function loadStudentOverrides(){
  try{
    const res = await window.storage.get(STUDENT_OVERRIDES_KEY, true);
    studentOverrides = res ? JSON.parse(res.value) : {};
  }catch(e){
    studentOverrides = {};
  }
  applyOverrides();
  renderStudents();
}

function applyOverrides(){
  studentsData.forEach(s=>{
    const ov = studentOverrides[s.no];
    if(ov){
      if(ov.foto) s.foto = ov.foto;
      if(typeof ov.bio === 'string') s.bio = ov.bio;
      if(typeof ov.ig === 'string') s.ig = ov.ig;
      if(typeof ov.tiktok === 'string') s.tiktok = ov.tiktok;
      if(typeof ov.wa === 'string') s.wa = ov.wa;
    }
  });
}

async function saveStudentOverride(s){
  studentOverrides[s.no] = { foto: s.foto, bio: s.bio, ig: s.ig, tiktok: s.tiktok, wa: s.wa };
  try{
    await window.storage.set(STUDENT_OVERRIDES_KEY, JSON.stringify(studentOverrides), true);
  }catch(e){
    toast('Gagal menyimpan, coba lagi.');
  }
}

/* ---------------- Render siswa ---------------- */
function renderStudents(){
  const grid = document.getElementById('studentGrid');
  grid.innerHTML = '';
  studentsData
    .sort((a,b)=> a.no - b.no)
    .forEach(s=>{
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <span class="no-tag mono">${s.no}</span>
        <img src="${s.foto}" alt="${s.nama}" loading="lazy">
        <div class="name">${s.nama}</div>
      `;
      card.addEventListener('click', ()=> openModal(s));
      grid.appendChild(card);
    });
  document.getElementById('studentCount').textContent = studentsData.length + ' siswa';
}

let currentStudent = null;

function renderModalView(s){
  document.getElementById('modalPhoto').src = s.foto;
  document.getElementById('modalPhoto').alt = s.nama;
  document.getElementById('modalNo').textContent = 'No. Absen ' + s.no;
  document.getElementById('modalName').textContent = s.nama;
  document.getElementById('modalBio').textContent = s.bio || 'Belum ada biodata.';

  const soc = document.getElementById('modalSocials');
  soc.innerHTML = '';
  const links = [
    s.ig ? {label:'Instagram', url:`https://instagram.com/${s.ig.replace('@','')}`} : null,
    s.tiktok ? {label:'TikTok', url:`https://tiktok.com/@${s.tiktok.replace('@','')}`} : null,
    s.wa ? {label:'WhatsApp', url:`https://wa.me/${s.wa.replace(/\D/g,'')}`} : null,
  ].filter(Boolean);

  if(links.length === 0){
    soc.innerHTML = '<span class="social-link" style="opacity:0.5;">Belum ada akun medsos</span>';
  } else {
    links.forEach(l=>{
      const a = document.createElement('a');
      a.className = 'social-link';
      a.href = l.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = l.label;
      soc.appendChild(a);
    });
  }

  document.getElementById('editStudentBtn').style.display = isAdmin ? 'inline-block' : 'none';
}

function openModal(s){
  currentStudent = s;
  renderModalView(s);
  document.getElementById('modalView').style.display = 'block';
  document.getElementById('modalEditForm').classList.remove('show');
  document.getElementById('studentOverlay').classList.add('show');
}

function closeModal(){
  document.getElementById('studentOverlay').classList.remove('show');
  document.getElementById('modalEditForm').classList.remove('show');
  document.getElementById('modalView').style.display = 'block';
}

document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('studentOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'studentOverlay') closeModal();
});

/* Buka form edit biodata (admin only) */
document.getElementById('editStudentBtn').addEventListener('click', ()=>{
  if(!currentStudent) return;
  document.getElementById('eFoto').value = currentStudent.foto || '';
  document.getElementById('eBio').value = currentStudent.bio || '';
  document.getElementById('eIg').value = currentStudent.ig || '';
  document.getElementById('eTiktok').value = currentStudent.tiktok || '';
  document.getElementById('eWa').value = currentStudent.wa || '';
  document.getElementById('modalView').style.display = 'none';
  document.getElementById('modalEditForm').classList.add('show');
});

document.getElementById('eCancel').addEventListener('click', ()=>{
  document.getElementById('modalEditForm').classList.remove('show');
  document.getElementById('modalView').style.display = 'block';
});

document.getElementById('eSave').addEventListener('click', async ()=>{
  if(!currentStudent) return;
  currentStudent.foto = document.getElementById('eFoto').value.trim() || currentStudent.foto;
  currentStudent.bio = document.getElementById('eBio').value.trim();
  currentStudent.ig = document.getElementById('eIg').value.trim();
  currentStudent.tiktok = document.getElementById('eTiktok').value.trim();
  currentStudent.wa = document.getElementById('eWa').value.trim();

  await saveStudentOverride(currentStudent);
  renderModalView(currentStudent);
  renderStudents();
  document.getElementById('modalEditForm').classList.remove('show');
  document.getElementById('modalView').style.display = 'block';
  toast('Biodata tersimpan');
});

/* ---------------- Admin login ---------------- */
const loginToggleBtn = document.getElementById('loginToggleBtn');
const logoutBtn = document.getElementById('logoutBtn');
const loginBox = document.getElementById('loginBox');
const adminPill = document.getElementById('adminPill');

loginToggleBtn.addEventListener('click', ()=> loginBox.classList.toggle('show'));

document.getElementById('passSubmit').addEventListener('click', tryLogin);
document.getElementById('passInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') tryLogin(); });

function tryLogin(){
  const val = document.getElementById('passInput').value;
  const msg = document.getElementById('loginMsg');
  if(val === ADMIN_PASSWORD){
    isAdmin = true;
    loginBox.classList.remove('show');
    document.getElementById('passInput').value = '';
    msg.textContent = '';
    loginToggleBtn.style.display = 'none';
    logoutBtn.style.display = 'inline-block';
    adminPill.classList.add('show');
    document.getElementById('showPrestasiForm').style.display = 'inline-block';
    document.getElementById('showGaleriForm').style.display = 'inline-block';
    renderPrestasi();
    renderGaleri();
    if(currentStudent) renderModalView(currentStudent);
    toast('Admin aktif');
  } else {
    msg.textContent = 'Password salah.';
  }
}

logoutBtn.addEventListener('click', ()=>{
  isAdmin = false;
  loginToggleBtn.style.display = 'inline-block';
  logoutBtn.style.display = 'none';
  adminPill.classList.remove('show');
  document.getElementById('showPrestasiForm').style.display = 'none';
  document.getElementById('showGaleriForm').style.display = 'none';
  document.getElementById('prestasiForm').classList.remove('show');
  document.getElementById('galeriForm').classList.remove('show');
  renderPrestasi();
  renderGaleri();
  document.getElementById('modalEditForm').classList.remove('show');
  document.getElementById('modalView').style.display = 'block';
  if(currentStudent) renderModalView(currentStudent);
  toast('Logout berhasil');
});

/* ---------------- PRESTASI (shared storage, admin-only tambah) ---------------- */
const PRESTASI_KEY = 'kelas7e-prestasi';
let prestasiData = [];

async function loadPrestasi(){
  try{
    const res = await window.storage.get(PRESTASI_KEY, true);
    prestasiData = res ? JSON.parse(res.value) : [];
  }catch(e){
    prestasiData = [];
  }
  renderPrestasi();
}

async function savePrestasi(){
  try{
    await window.storage.set(PRESTASI_KEY, JSON.stringify(prestasiData), true);
  }catch(e){
    toast('Gagal menyimpan, coba lagi.');
  }
}

function renderPrestasi(){
  const list = document.getElementById('prestasiList');
  if(prestasiData.length === 0){
    list.innerHTML = '<div class="empty-state">Belum ada prestasi yang ditambahkan.</div>';
    return;
  }
  list.innerHTML = '';
  prestasiData.slice().reverse().forEach((p)=>{
    const realIndex = prestasiData.indexOf(p);
    const item = document.createElement('div');
    item.className = 't-item';
    item.innerHTML = `
      <div class="t-date mono">${p.date || ''}</div>
      <h4>${p.title}</h4>
      <p>${p.desc || ''}</p>
      ${isAdmin ? `<div class="t-controls"><button class="btn small danger" data-i="${realIndex}">Hapus</button></div>` : ''}
    `;
    if(isAdmin){
      item.querySelector('button').addEventListener('click', async (e)=>{
        prestasiData.splice(realIndex, 1);
        await savePrestasi();
        renderPrestasi();
        toast('Prestasi dihapus');
      });
    }
    list.appendChild(item);
  });
}

document.getElementById('showPrestasiForm').addEventListener('click', ()=>{
  document.getElementById('prestasiForm').classList.toggle('show');
});
document.getElementById('pCancel').addEventListener('click', ()=>{
  document.getElementById('prestasiForm').classList.remove('show');
});
document.getElementById('pSubmit').addEventListener('click', async ()=>{
  const title = document.getElementById('pTitle').value.trim();
  const date = document.getElementById('pDate').value.trim();
  const desc = document.getElementById('pDesc').value.trim();
  if(!title){ toast('Judul prestasi wajib diisi'); return; }
  prestasiData.push({title, date, desc});
  await savePrestasi();
  document.getElementById('pTitle').value = '';
  document.getElementById('pDate').value = '';
  document.getElementById('pDesc').value = '';
  document.getElementById('prestasiForm').classList.remove('show');
  renderPrestasi();
  toast('Prestasi ditambahkan');
});

/* ---------------- GALERI KELAS (shared storage, admin-only tambah) ---------------- */
const GALERI_KEY = 'kelas7e-galeri';
let galeriData = [];

async function loadGaleri(){
  try{
    const res = await window.storage.get(GALERI_KEY, true);
    galeriData = res ? JSON.parse(res.value) : [];
  }catch(e){
    galeriData = [];
  }
  renderGaleri();
}

async function saveGaleri(){
  try{
    await window.storage.set(GALERI_KEY, JSON.stringify(galeriData), true);
  }catch(e){
    toast('Gagal menyimpan, coba lagi.');
  }
}

function renderGaleri(){
  const grid = document.getElementById('galeriGrid');
  if(galeriData.length === 0){
    grid.innerHTML = '<div class="empty-state">Belum ada foto kelas.</div>';
    return;
  }
  grid.innerHTML = '';
  galeriData.forEach((g, i)=>{
    const item = document.createElement('div');
    item.className = 'gal-item';
    item.innerHTML = `
      <img src="${g.url}" alt="${g.caption || 'Foto kelas'}" loading="lazy">
      ${isAdmin ? `<button class="gal-del" data-i="${i}">Hapus</button>` : ''}
    `;
    if(isAdmin){
      item.querySelector('.gal-del').addEventListener('click', async (e)=>{
        e.stopPropagation();
        galeriData.splice(i, 1);
        await saveGaleri();
        renderGaleri();
        toast('Foto dihapus');
      });
    }
    grid.appendChild(item);
  });
}

document.getElementById('showGaleriForm').addEventListener('click', ()=>{
  document.getElementById('galeriForm').classList.toggle('show');
});
document.getElementById('gCancel').addEventListener('click', ()=>{
  document.getElementById('galeriForm').classList.remove('show');
});
document.getElementById('gSubmit').addEventListener('click', async ()=>{
  const url = document.getElementById('gUrl').value.trim();
  const caption = document.getElementById('gCaption').value.trim();
  if(!url){ toast('URL foto wajib diisi'); return; }
  galeriData.push({url, caption});
  await saveGaleri();
  document.getElementById('gUrl').value = '';
  document.getElementById('gCaption').value = '';
  document.getElementById('galeriForm').classList.remove('show');
  renderGaleri();
  toast('Foto ditambahkan');
});

/* ---------------- Init ---------------- */
renderStudents();
loadStudentOverrides();
loadPrestasi();
loadGaleri();
